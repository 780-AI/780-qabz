# Local development stack. The variables come from config_generated.env, which is generated from the
# YAML config (config.yml, git-ignored). Start the stack with `make compose up`; never write that file by hand.
# `make compose up|down|ps|logs` (ARGS="..." passes flags); `up` starts postgres and redis. Run docker compose by hand only with the env file:
#   docker compose --env-file config_generated.env up -d
# The `qabz` service has the profile `app`:
#   docker compose --env-file config_generated.env --profile app up -d --build
# It needs a Dockerfile, which arrives with the service code (plan Step 5 and later).

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qabz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set database.postgres.password in config.yml}
      POSTGRES_DB: ${POSTGRES_DB:-qabz}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qabz:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
