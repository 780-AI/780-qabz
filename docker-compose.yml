# Local development stack. The variables come from config_generated.env, which is generated from the
# YAML config (config.yml, git-ignored). Start the stack with `make compose up`; never write that file by hand.
# `make compose up|down|ps|logs` (ARGS="..." passes flags); `up` starts postgres and redis. Run docker compose by hand only with the env file:
#   docker compose --env-file config_generated.env up -d
# The `qabz` service has the profile `app`:
#   docker compose --env-file config_generated.env --profile app up -d --build
# It needs a Dockerfile, which arrives with the service code (plan Step 5 and later).
# The `kafka` service has the profile `kafka` (task 045: the QA of the Parsian status worker); `make compose up`
# does not start it:
#   COMPOSE_PROFILES=kafka make compose up ARGS="-d --wait"    (--profile in ARGS does not work: it must come before up)
# It listens on localhost:9092, the default of kafka.brokers. Read the status messages with:
#   docker compose --env-file config_generated.env exec kafka /opt/kafka/bin/kafka-console-consumer.sh \
#     --bootstrap-server localhost:9092 --topic paymentwriter --from-beginning --property print.key=true
# The `jaeger` service has the profile `tracing` (task 047: the traces of conventions § 17); `make compose up`
# does not start it:
#   COMPOSE_PROFILES=tracing make compose up ARGS="-d --wait"  (both: COMPOSE_PROFILES=tracing,kafka)
# Set logs.tracing.enabled: true and logs.tracing.otlp_endpoint: "localhost:4317" in config.yml and open the UI at http://localhost:16686.
# The store is in memory: a restart of the container drops the traces.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qabz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set database.postgres.password in config.yml}
      POSTGRES_DB: ${POSTGRES_DB:-qabz}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    profiles: ["kafka"]
    image: apache/kafka:3.9.0      # one node in KRaft mode (no ZooKeeper); development only
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  jaeger:
    profiles: ["tracing"]
    image: jaegertracing/jaeger:2.23.0   # all-in-one (collector, in-memory store, UI); development only
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"   # the UI and the query API
      - "127.0.0.1:${JAEGER_OTLP_PORT:-4317}:4317"   # OTLP gRPC: logs.tracing.otlp_endpoint

  qabz:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
