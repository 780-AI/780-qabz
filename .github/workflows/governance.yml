name: governance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Doc coverage
        run: python scripts/check_doc_coverage.py
      - name: Test coverage drift
        run: python scripts/check_test_coverage_drift.py --ci
