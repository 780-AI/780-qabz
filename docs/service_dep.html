<script>
(function () {
  var DATA = {"Parsian": ["Inquiry", "Order"], "Jiring Switch": ["Inquiry", "Order (only if Parsian is out of service)"], "Irancell": ["Inquiry", "Order"], "Qabzino": ["Inquiry"], "Tavanir": ["Inquiry", "Bill document"], "Payment service": ["Payment"]};
  var ACC = { p1: "#7D8FA3", p2: "#E8922A", p3: "#7B68B5" };
  var tip = document.getElementById("tip");
  function show(g) {
    var name = g.getAttribute("data-name");
    var items = DATA[name] || [];
    tip.innerHTML = "<b>" + name + "</b><ul>" + items.map(function (t) { return "<li>" + t + "</li>"; }).join("") + "</ul>";
    tip.style.setProperty("--acc", ACC[g.getAttribute("data-pal")]);
    tip.style.left = "0px"; tip.style.top = "0px";
    var r = g.querySelector("circle").getBoundingClientRect();
    var x = r.left + r.width / 2 + window.scrollX;
    var h = tip.offsetHeight, w = tip.offsetWidth;
    var above = r.top - h - 12 > 0;
    var left = Math.max(8, Math.min(x - w / 2, document.documentElement.clientWidth - w - 8));
    tip.style.left = left + "px";
    tip.style.top = (above ? r.top + window.scrollY - h - 12 : r.bottom + window.scrollY + 12) + "px";
    tip.classList.add("on");
  }
  function hide() { tip.classList.remove("on"); }
  Array.prototype.forEach.call(document.querySelectorAll(".dep"), function (g) {
    g.addEventListener("mouseenter", function () { show(g); });
    g.addEventListener("mouseleave", hide);
    g.addEventListener("focus", function () { show(g); });
    g.addEventListener("blur", hide);
  });
})();
</script>
