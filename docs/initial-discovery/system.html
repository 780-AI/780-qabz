# System

The refactor makes no database changes. What is merged is described in the Overview.

## Overview

`bill` is refactored into a new service named `qabz`. Together with it, `qabz` includes `Tavanir` and `Qabzino`. The rest stays the same for the time being.

## Endpoints

The following are all endpoints involved in the inquiry and ordering of the bills of various types. Their associated endpoint after the refactor is also written.

| `bill` | REST | `POST /v1/water/order` | `POST /v3/water/order` | Order | Water |
| `bill` | REST | `POST /v2/water/order` | `POST /v3/water/order` | Order | Water |
| `bill` | REST | `POST /v1/electricity/inquiry` | `POST /v3/electricity/inquiry` | Inquiry | Electricity |
| `bill` | REST | `POST /v1/electricity/inquiry/document` | `POST /v3/electricity/inquiry/document` | Inquiry | Electricity |
| `bill` | REST | `POST /v1/electricity/order` | `POST /v3/electricity/order` | Order | Electricity |
| `bill` | REST | `POST /v2/electricity/order` | `POST /v3/electricity/order` | Order | Electricity |
| `bill` | REST | `POST /v1/gas/inquiry` | `POST /v3/gas/inquiry` | Inquiry | Gas |
| `bill` | REST | `POST /v1/gas/order` | `POST /v3/gas/order` | Order | Gas |

| `parsian-v2` | gRPC | `haf80.api.parsian_v2.TopBill/Inquiry` | internal | Inquiry | Water, Electricity, Gas, Landline, MCI mobile |

| `jiring-switch` | gRPC | `haf80.api.jiringSwitch.InternalInquiryService/BillInquiry` | internal | Inquiry | MCI mobile |
| `jiring-switch` | gRPC | `haf80.api.jiringSwitch.InternalInquiryService/PayBill` | internal | Order | MCI mobile |

`Parsian` and `Irancell`: from the app's perspective, the call is internal. Inside `qabz`, `Parsian` proxies the call to its current microservice, and so does `Irancell`.

## Config

Config now contains more entries. It must include the config entries of every provider as well.

Every provider has its own block under `providers` (the section is `providers`, as in the code; the key `providers.general` holds the settings of `ProvidersService`). The real blocks of `qabzino` (task 021), `tavanir` (task 022), `irancell` (task 035), `jiring_switch` and `parsian` (task 036):

```yaml
providers:
  general:
    load_interval: 1m
  qabzino:
    grpc_address: qabzino:9000   # host:port of the old qabzino service; read only by QabzinoProxy (not used since task 030)
    timeout: 10s                 # limit of each call to Ayantech; positive
    enabled: false               # false (default): Qabzino cannot be used (every call fails as "provider down", no call to Ayantech, the mock does not apply) (task 030)
    token: ""                    # Ayantech token (secret); the real value only in config.yml (task 029)
    electricity_bill_endpoint: "" # no default (task 036): the real URL only in config.yml
    gas_bill_endpoint: ""        # no default (task 036): the real URL only in config.yml; read since task 023
    rightel_bill_endpoint: ""    # no default: the real URL only in config.yml; the Rightel mobile inquiry (task 037)

### Hot Reload

**Gap.** The current system reads its config once, when it starts. Changing a config value needs a restart. Only the JWT public keys (through etcd) and the error messages (every hour) are refreshed while it runs.

Only certain configs are hot reloadable. The new system must say which, and treat the rest as startup-only.

| Config | Hot reloadable | Why |
|---|---|---|
| Provider order, status and priority (the `providers` table) | Yes | It is read from the database every `providers.general.load_interval` (`ProvidersService`, `provider/selector.go`), so a change needs no restart. The interval itself is hot-reloadable and a change applies at once: `config.Holder.Changed()` wakes the reload routine, which stops the wait in progress when the effective interval (after the 1 s minimum) changed and runs the next load at (start of the last load + new interval), at once when that time is past; the same effective value restarts nothing and a load in progress is not interrupted. Each load has a fixed timeout of 10 s (`loadTimeout`, not a config key): a slower load fails, is counted as `error`, writes one error line and keeps the last list |
| Switch demotion period | Yes | It is read each time a provider is demoted |
| Cron intervals and the order time window | Yes | The runner can re-read them before each run |
| Circuit breaker thresholds | Yes | Applied to the breaker's next count |
| Log level | Yes | A runtime flag |
| Fee rules (the `fees` table) | Yes | It is read from the database |
| JWT public keys | Yes | Already reloaded through etcd |
| Provider URLs and timeouts (`providers.qabzino.*`, `providers.tavanir.*`, `providers.irancell.*`, `providers.jiring_switch.*`, `providers.parsian.*`) | No | Held by the client built at startup |
| Inquiry cache TTL of a bill type (`caching.water`, `caching.electricity`, `caching.gas`, `caching.irancell`, `caching.mobile`) | No | Read at startup (tasks 021, 022, 023, 035 and 036); hot reload would need an `app_hot_configs` key and a migration |
| Provider mocks (`debug.mocks.<provider>`) | No | Applied when the adapters are built, in dev mode only |
| Credentials and tokens | No | Held by the client built at startup |
| Database, Redis, Kafka and NATS connections | No | The connections are made once, at startup |
| Ports and the listening addresses | No | Bound once, at startup |

## Code

### Provider Adapter Interface

Every provider inside the new service is defined as a Go package. Every provider has to implement `ProviderInterface`.

Both `Parsian` and `Irancell` are also used by other services (see Issue #3), so they cannot be shut down. For this reason, the current adapter implementations of `Parsian` and `Irancell` actually proxy the calls to the existing provider services (`parsian-v2` and `irancell`). Hence they are named `ParsianProxy` and `IrancellProxy`.

```go
type ProviderInterface interface {
	Name() string
	SupportsInquiry(billType string) bool
	Inquiry(ctx context.Context, req InquiryRequest) (*InquiryResponse, error)
	Pay(ctx context.Context, req PaymentRequest) (*PaymentResponse, error)
	Status(ctx context.Context, req StatusRequest) (*StatusResponse, error)
	GetDocument(ctx context.Context, req DocumentRequest) (*DocumentResponse, error)
	Settle(ctx context.Context, req SettleRequest) (*SettleResponse, error)
}

type ProviderRegistry interface {
	Register(p ProviderInterface) error
	Get(name string) (ProviderInterface, bool)
}
```

**Bill types of an adapter (task 036).** `SupportsInquiry` reports whether `Inquiry` answers a bill type. A `providers` row can name a provider for a bill type that its adapter does not inquire (the seed has `parsian` for water and gas; ParsianProxy answers only the MCI mobile bill). The inquiry flow then does not call the adapter: no saved-inquiry read, no request row, and the answer of a provider with no adapter (HTTP 503, one error log line). A provider mock wraps the adapter and has the same bill types.

**Details of an inquiry (task 022).** The interface has no separate method for details. `InquiryResponse` has the field `Details *Details`, with one field for each bill type that has details (`Details.Electricity`: phase, company name, tariff type, customer type, serial number, service address, service post code, customer name, and the `city` and `region` that the order flow of `bill` reads; `Details.Gas` (task 023): `city` and `kind`, the two keys that `bill` saves for a Qabzino gas answer; the client does not get them). An adapter with no details (Qabzino water) leaves it nil. The inquiry flow (`core/inquiry`) saves the details with each inquiry in `bill_inquiries.extra_data` (one JSON object; `bill` writes only `city` and `region` there) and reads them back when saved inquiries answer the call, so the answer from the database has the same details as the answer of the provider.

**Inquiry ID of a bill type (task 023).** `InquiryRequest.InquiryID` is the bill ID for water and electricity, and the participate code for gas (`bill`: `SetInquiryID`). The handler of each endpoint gives the bill type; the inquiry flow has one table of bill types (`billTypes` in `core/inquiry`: the `tid` prefix and the rule of the inquiry ID) and does not read the type from the ID. The inquiry ID is the key of the saved inquiries (`bill_inquiries.inquiry_id`), so two participate codes are two keys. A gas request with both `billId` and `payId` is the raw inquiry of `bill`: no provider and no saved inquiry; the price is read from the pay ID and the answer has `price`, `payId` and `billId` (`inquiry.Service.RawInquiry`, `docs/this_vs_bill.md` item 28).

**Mobile inquiry, the Irancell operator (task 035).** `POST /v1/mobile/inquiry` gives the bill type from the `operator` field of the request (one table, `phoneOperators` in `entry/grpc/phone.go`; MCI and Rightel came with tasks 036 and 037; until then they answered HTTP 501). For Irancell the bill type is `irancell`, the inquiry ID is the phone (a mobile number in the 98 form), the `tid` prefix is 8, and one answer has a mid-term and a final-term inquiry (`InquiryItem.InquiryType` `midterm` and `final_term`), saved as two rows and returned in `midTerm` and `fullTerm`. **Only the Irancell provider may answer** (operator rule): the entry of the bill type in `billTypes` names the one provider (`onlyProvider`); when the pick of `ProvidersService` is another provider, the flow calls nobody, reads no saved inquiry and answers as "no enabled provider" (HTTP 503). The Irancell adapter (IrancellProxy, `provider/irancellproxy`) is a gRPC client of the `irancell` service (`pb.InternalService/BillInquiry`, generated by `make proto` from `pb/proto/irancell/internalService.proto`); the `irancell` service calls Irancell, `qabz` does not (`docs/this_vs_bill.md` items 30 and 31).

**Mobile inquiry, the MCI operator (task 036).** The operator `mci` (also a request with no operator, the enum value 0) gives the bill type `mobile`; the inquiry ID is the phone and the `tid` prefix is 5. The providers are the sorted list of (`mobile`, `inquiry`) (`ProvidersService`, priority ascending): the Jiring Switch adapter (`provider/jiring`, a gRPC client of the `jiring-switch` service, `InternalInquiryService/BillInquiry`; no payment deadline, no trace ID) and the Parsian adapter (ParsianProxy, `provider/parsianproxy`, a gRPC client of the `parsian-v2` service, `TopBill/Inquiry` with the bill type `mobile_mci` and a new tracking and reference ID; it gives the `tid` and a payment deadline). The operator wants Jiring Switch first and Parsian next: the order comes only from the priority of the rows (in the dev seed Jiring Switch, id 28, is disabled and has priority 10 after Parsian, id 39, priority 2). **One request calls one provider:** the pick of `PickProvider`. Its answer is the answer of the request, also when it is an error; the flow never calls Parsian after a failed Jiring Switch call. The move to the next provider is the job of the Provider Switcher (below), the same for every bill type. As in `bill`, two saved rows of the same inquiry type do not answer from the database (`shouldSkipCache`; `skipSameTypePair` in `billTypes`). The cache TTL is `caching.mobile` (default `5h`, as `bill`). `docs/this_vs_bill.md` item 32.

**Mobile inquiry, the Rightel operator (task 037).** The operator `rightel` gives the bill type `mobilemidtermRightel`; the inquiry ID is the phone and the `tid` prefix is 6 (`bill`: `RightelMobileReference`). **Only the Qabzino provider may answer** (operator rule, 2026-11-11): the entry of the bill type in `billTypes` names the one provider (`onlyProvider: qabzino`, the mechanism of Irancell); when the pick of (`mobilemidtermRightel`, `inquiry`) is another provider, or no row is enabled (the seed: row 34, enabled), the flow calls nobody and answers HTTP 503; there is no fallback. The direct Qabzino adapter (`provider/qabzino`, one more kind in its `kinds` table) sends Ayantech `RightelMobileBillInquiry` (`providers.qabzino.rightel_bill_endpoint`, no default) with `MobileNumber` in the 0 form and `TraceNumber`. `G00000` gives the bill ID of the mid-term part and a mid-term and a final-term inquiry (the pay ID and the amount of each part, no deadline); `GD2268` is no debt (two inquiries of amount 0); `GD2261` and `GD2267` are refused with a user text (HTTP 400); `GD2266` and every other code are provider down (HTTP 503). The cache TTL is `caching.mobile` (the key of MCI, as `bill`; operator decision); `bill` has no same-type skip for this bill type. The `bill` row 32 (`mobileRightel`) is not used: the operator table never gives that bill type. `docs/this_vs_bill.md` item 33.

### Provider Switcher

**Gap.** The current system has no automatic provider switcher. The new system must have one.

`ProviderSwitcher` moves a bill type to the next provider of its sorted list when the circuit breaker of the current provider detects that the provider does not work. Every provider has a circuit breaker. An open breaker means the provider is skipped, without waiting for a timeout.

**One generic rule for every bill type (operator, 2026-11-11, task 036).**
- **The answer of a provider is the answer.** One request calls one provider: the first provider of the current order. What it returns is the answer of that request: a success, a business answer, an error, a timeout or an answer that cannot be used. The request does not call a second provider.
- **Only the circuit breaker starts a switch.** A failed call is counted by the breaker of its provider. When the breaker detects the condition (it opens), the switcher demotes that provider, so the next requests pick the next provider of the list. One failed call alone switches nothing.
- **Nothing special.** The switch has no rule for a bill type, an operator or a provider name; the order is the priority of the `providers` rows. A bill type with one provider (for example `irancell`) has no next provider: while its breaker is open, the answer is provider-down.
- Until the breakers are added (task 034: at the end of the project), no provider is ever switched: each request uses the pick of `PickProvider`, and a disabled row is skipped by the pick itself.

**Gap.** `bill` has no circuit breaker. Only `irancell` and `tavanir` have one. The new system must have one for every provider. Until then no provider adapter of `qabz` has one (operator decision of task 034: it is added to every provider at the end of the project); the keys `providers.tavanir.circuit_breaker.*` are parsed and not used.

A circuit breaker counts the recent failures of one provider. When too many calls fail, it opens and stops sending calls to that provider, so requests don't wait for a timeout one by one. After a short time it lets one test call through. If the test succeeds, it closes and the provider is used again.

A switch temporarily re-orders the providers: the provider that failed moves to the end of the order. It comes back to its original order after a set duration. The original order itself, the `priority` of the `providers` table, is not changed.

```go
type ProviderSwitcher interface {
	Call(ctx context.Context, billType entity.BillType, action entity.Action, fn func(ctx context.Context, p ProviderInterface) error) error
	Order(ctx context.Context, billType entity.BillType, action entity.Action) ([]entity.InternalProvider, error)
	Demote(ctx context.Context, name entity.InternalProvider, billType entity.BillType, action entity.Action, period time.Duration) error
}
```

How a provider switches back to normal:

1. **Demoted.** A provider whose circuit breaker opens moves to the end of the order for the given `period`.
2. **Trial.** When the `period` ends, one test request goes to it (the half-open state of its circuit breaker). All other requests keep using the working provider.
3. **Back to normal.** If the test succeeds, the provider returns to its original place. If it fails, it is demoted again.

The test request is never a payment. Inquiry and status check calls are used instead.

### Cron Interface

Every cron job is a type that implements `CronInterface`. The crons are registered once, at startup, in the registry.

```go
type CronInterface interface {
	Name() string
	Interval() time.Duration
	Lock() *LockPolicy
	Run(ctx context.Context) error
}

// For demonstration purposes only: in the real implementation
// CronRegistry is a struct, not an interface.
type CronRegistry interface {
	Register(c CronInterface) error
	Get(name string) (CronInterface, bool)
	All() []CronInterface
}
```

Crons:

| Cron | Interval | Orders it handles | Action |
|---|---|---|---|
| `Jiring Switch` get-status | 5s | `pending` and `in-progress`, MCI | Asks `jiring-switch` for the status and saves `success` or `failed` |
| `Parsian` get-status | 15m | `pending` and `in-progress`, all other bills paid via `Parsian` | Asks `parsian-v2` |
| `Irancell` get-status | In config | `pending` and `in-progress`, `Irancell` | Asks `irancell` |
| Landline confirm | In config | `success` landline orders `Karashab` hasn't confirmed | Sends `Karashab` the payment info and marks the order confirmed |

## Logs, Metrics and Alerts

**Gap.** The current system severely lacks custom metrics. This part needs to be covered in the new system.

Custom Prometheus metrics defined by `qabz`, on top of the default ones. Names start with `qabz_`. Durations are in milliseconds, and their names end with `_ms` (`PROJECT_SPECIFIC_CONVENTIONS.md` § 9). Any of them can be **alertable**.

**Prometheus switch.** `metrics.prometheus.enabled` (default `true`) turns all metrics on or off. When it is `false`, no metric is registered or recorded and the metrics endpoint does not listen.

### Requests and orders

| Metric | Type | What it tells you |
|---|---|---|
| `qabz_request_duration_ms` | histogram | Duration of every incoming request (gRPC and HTTP gateway) in milliseconds, by `path` (the gRPC method, for example `/haf80.api.bill.Service/Get`) and `code` (the gRPC code); buckets 5 ms to 10 000 ms. Its `_count` series is the request counter. A call that the auth check rejects is counted. An unknown HTTP route is not counted |
| `qabz_inquiries_total` | counter | Inquiries by `bill_type`, `provider` (`none` when no provider was picked) and `result`: `db_hit` (answered from saved inquiries, no provider call), `provider_ok`, `provider_refused` (the provider has no inquiry), `provider_down` (the call failed), `no_provider`, `canceled` (the client left during the provider call), `error`, `raw` (a gas request with `billId` and `payId`, answered from the two IDs, provider `none`). Implemented for water (task 021), electricity (task 022), gas (task 023) the Irancell mobile bill (task 035, `bill_type="irancell"`), the MCI mobile bill (task 036, `bill_type="mobile"`) and the Rightel mobile bill (task 037, `bill_type="mobilemidtermRightel"`) |
| `qabz_orders_total` | counter | Every order status change (the state machine) |
| `qabz_order_amount_rials_total` | counter | Money paid, counted on `success` only |
| `qabz_order_complete_duration_ms` | histogram | How long `OrderComplete` takes |

### Providers

| Metric | Type | What it tells you |
|---|---|---|
| `qabz_provider_call_duration_ms` | histogram | Latency of each provider call in milliseconds, by `provider` and `action` (`inquiry`), for every result; buckets 5 ms to 30 000 ms. Implemented for the inquiry call (Qabzino: task 021; Tavanir: task 022) |
| `qabz_provider_calls_total` | counter | Calls per `provider`, `action` (`inquiry`) and `result`: `ok`, `refused` (the provider has no inquiry), `down` (the call failed), `canceled` (the client left), `error`. Implemented for the inquiry call (Qabzino: task 021; Tavanir: task 022) |
| `qabz_provider_timeouts_total` | counter | Timeouts, which trigger a switch |
| `qabz_providers_loads_total` | counter | Loads of the `providers` table by `ProvidersService`, by `result` (`ok`, `error`). A rise of `error` means the list is stale. An aborted load (canceled by `Stop` or by the `App.Start` context) is neither counted nor timed |
| `qabz_providers_load_duration_ms` | histogram | Duration of each load of the `providers` table (ok and error) in milliseconds; buckets 1 ms to 10 000 ms (the fixed 10 s load timeout). An aborted load (canceled by `Stop` or by the `App.Start` context) is neither counted nor timed |
| `qabz_providers_last_load_success_timestamp_ms` | gauge | Unix time in milliseconds of the last good load (0: none yet). Alert when it is older than a few load intervals |
| `qabz_providers_changes_total` | counter | Runtime changes of the provider list, by `change` (`move_up`, `move_down`, `enable`, `disable`) and `result` (`changed`, `unchanged`, `unknown_id`) |
| `qabz_providers_active_count` | gauge | Enabled providers (`status = 'enable'`) in all groups of the current provider list, one total with no labels. Set after each good load and after each `Enable` / `Disable` that changed the list; a failed load keeps the last value. 0 means `PickProvider` finds no provider for any group |

### Circuit breaker and switcher

| Metric | Type | What it tells you |
|---|---|---|
| `qabz_circuit_breaker_state` | gauge | Breaker state per provider: closed, half-open or open |
| `qabz_circuit_breaker_transitions_total` | counter | How often a breaker trips and recovers |
| `qabz_provider_switches_total` | counter | Calls that moved to another provider |
| `qabz_provider_demoted` | gauge | Providers demoted right now |
| `qabz_provider_trial_total` | counter | Test calls that decide if a provider returns |

### Crons and settlement

| Metric | Type | What it tells you |
|---|---|---|
| `qabz_cron_runs_total` | counter | Cron runs, by result |
| `qabz_cron_duration_ms` | histogram | How long a cron run takes |
| `qabz_cron_orders_processed_total` | counter | What each run did with the orders it picked |
| `qabz_pending_orders` | gauge | Orders waiting right now |
| `qabz_oldest_pending_order_age_ms` | gauge | Age of the oldest pending order, against the 10-hour deadline |
| `qabz_karashab_unconfirmed_orders` | gauge | Landline orders not yet confirmed |

### Infrastructure

| Metric | Type | What it tells you |
|---|---|---|
| `qabz_dependency_up` | gauge | 1 if Postgres, Redis, Kafka, NATS or etcd answers |
| `qabz_dependency_check_duration_ms` | gauge | Response time of that check |
| `qabz_db_query_duration_ms` | histogram | Duration of the main queries |

### Logs

`qabz` uses the same log packages as the `bill` service (`pkg/log` and `pkg/logger`), built on `zap`. Logs are shipped to Logstash, and the gRPC interceptor puts the logger into the request context.

**Tracing is used.** Every request and every call to a provider is a span, sent to Jaeger. One payment can be followed from the request of the app to the answer of the provider.

## Tests

Tests are divided into two sections: unit tests and feature tests.

- **Unit tests.** Test one piece of code on its own.
- **Feature tests.** Test a whole feature from the entry point. They work on a temporary database and mocked providers.

## Gaps

Where the current system falls short, and where the new one must cover it. Each item links to the gap in the page.

| Gap | Section |
|---|---|
| [Config is not hot reloadable](#gap-1) | Hot Reload |
| [No automatic provider switcher](#gap-2) | Provider Switcher |
| [No circuit breaker](#gap-3) | Provider Switcher |
| [Almost no custom metrics](#gap-4) | Logs, Metrics and Alerts |

## Issues

### Issue #1 (new version problem in URL)

Due to inconsistency between version numbers, we either have to use `v3` for the new implementation or use a new URL slug (like `qabz`, for example) to escape version confusion.

If a new URL slug is used (my own recommendation), `v1` should be used naturally.

### Issue #2 (database)

Current `bill`'s database is used. No change. Migrations are added on demand. This service cannot start on a new database. The cost, specially at this phase is not worth the trouble.

### Issue #3 (Backward compatibility)

Services such as `Parsian` and `Irancell` have other clients than `bill` (traffic and `recharge`). We cannot shut them down fully, and we cannot touch the database until the other clients are decided.

### Issue #4 (Proxy)

The `Irancell` and `Parsian` implementations (`IrancellProxy` and `ParsianProxy`) only proxy requests to the current `Irancell` and `Parsian` microservices. This is necessary to keep other services using `Parsian` and `Irancell` up and running.

var SOURCE = document.getElementById("md-source").textContent.replace(/<\\\/script/gi, "</script");

function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function slug(t) {
  return t.replace(/[`*]/g, "").toLowerCase().replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-");
}

function inline(t) {
  var parts = t.split("`"), out = [];
  for (var i = 0; i < parts.length; i++) {
    var p = esc(parts[i]);
    if (i % 2) {
      out.push("<code>" + p + "</code>");
    } else {
      p = p.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      p = p.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (all, text, href) {
        return /^\s*javascript:/i.test(href) ? text : '<a href="' + href + '">' + text + "</a>";

}

function splitRow(line) {
  var cells = [], cur = "", tick = false;
  line = line.trim();

  for (var i = 0; i < line.length; i++) {
    var ch = line.charAt(i);
    if (ch === "`") tick = !tick;
    if (ch === "|" && !tick) { cells.push(cur.trim()); cur = ""; }
    else cur += ch;
  }
  cells.push(cur.trim());

}

function plain(t) { return t.replace(/`|\*\*/g, ""); }

function renderTable(rows) {
  var head = splitRow(rows[0]);
  var data = [];
  for (var r = 2; r < rows.length; r++) {
    var cells = splitRow(rows[r]);
    while (cells.length < head.length) cells.push("");
    data.push(cells.slice(0, head.length));

  // column widths follow the longest text in each column, within a sensible range
  var lens = head.map(function (h, k) {
    var m = plain(h).length;
    data.forEach(function (row) { m = Math.max(m, plain(row[k]).length); });
    return Math.min(Math.max(m, h === "Kind" || h === "Action" ? 12 : 7), 46);
  });
  var total = lens.reduce(function (a, b) { return a + b; }, 0);
  var cols = lens.map(function (l) { return '<col style="width:' + (100 * l / total).toFixed(2) + '%">'; }).join("");
  var minWidth = Math.round(total * 7.4 + head.length * 34);
  var pill = head.map(function (h) { return h === "Action" || h === "Kind"; });
  var th = head.map(function (h) { return '<th aria-sort="none" tabindex="0" role="columnheader" title="Click to sort"><div class="cell">' + inline(h) + "</div></th>"; }).join("");
  var idx = 0;
  var trs = data.map(function (row) {
    return '<tr data-i="' + (idx++) + '">' + row.map(function (c, k) {
      var cell = inline(c);
      if (pill[k] && c) cell = '<span class="pill pill-' + c.toLowerCase().replace(/[^a-z]/g, "") + '">' + cell + "</span>";

  return '<div class="tablewrap"><table style="min-width:' + minWidth + 'px"><colgroup>' + cols + "</colgroup><thead><tr>" + th + "</tr></thead><tbody>" + trs + "</tbody></table></div>";

var GO_TYPES = { "string":1, "int":1, "int32":1, "int64":1, "uint":1, "uint32":1, "uint64":1, "bool":1, "byte":1, "rune":1, "error":1, "float32":1, "float64":1, "any":1, "nil":1, "true":1, "false":1 };

function highlightGo(code) {

  var out = "", m, prev = "";
  while ((m = re.exec(code))) {
    if (m[1]) out += span("cm", m[1]);
    else if (m[2]) out += span("st", m[2]);
    else if (m[3]) out += span("nm", m[3]);
    else if (m[4]) {
      var w = m[4], rest = code.slice(re.lastIndex).match(/^\s*\(/);
      if (GO_KEYWORDS[w]) out += span("kw", w);

      else if (rest) out += span("fn", w);
      else if (/^[A-Z]/.test(w) || prev === "*" || prev === "&") out += span("ty", w);
      else out += esc(w);
      prev = w; continue;
    } else {
      var c = m[5];
      out += /[(){}\[\],;:.*&<>=+\-!|\/]/.test(c) ? span("pn", c) : esc(c);
      if (!/\s/.test(c)) prev = c;

  return out;

var SQL_KEYWORDS = { "select":1, "from":1, "where":1, "and":1, "or":1, "not":1, "in":1, "is":1, "null":1, "as":1, "on":1, "join":1, "left":1, "right":1, "inner":1, "outer":1, "group":1, "by":1, "order":1, "having":1, "limit":1, "offset":1, "insert":1, "into":1, "values":1, "update":1, "set":1, "delete":1, "create":1, "table":1, "alter":1, "add":1, "column":1, "drop":1, "index":1, "primary":1, "key":1, "default":1, "unique":1, "constraint":1, "with":1, "union":1, "all":1, "distinct":1, "case":1, "when":1, "then":1, "else":1, "end":1, "exists":1, "between":1, "like":1, "asc":1, "desc":1, "over":1, "partition":1, "returning":1, "if":1, "begin":1, "commit":1, "rollback":1, "true":1, "false":1 };
var SQL_TYPES = { "uuid":1, "varchar":1, "text":1, "integer":1, "int":1, "bigint":1, "smallint":1, "boolean":1, "bool":1, "jsonb":1, "json":1, "timestamp":1, "timestamptz":1, "numeric":1, "date":1 };

function highlightSql(code) {
  var re = /(--[^\n]*|\/\*[\s\S]*?\*\/)|('(?:[^'\\]|\\.|'')*')|("(?:[^"]|"")*")|(\$\d+|\?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|([\s\S])/g;
  var out = "", m;
  while ((m = re.exec(code))) {
    if (m[1]) out += span("cm", m[1]);
    else if (m[2]) out += span("st", m[2]);
    else if (m[3]) out += span("ty", m[3]);
    else if (m[4]) out += span("nm", m[4]);
    else if (m[5]) out += span("nm", m[5]);

      var w = m[6], lw = w.toLowerCase(), isCall = /^\s*\(/.test(code.slice(re.lastIndex));

      out += /[(){}\[\],;:.*<>=+\-!|\/]/.test(c) ? span("pn", c) : esc(c);

}

function highlightYamlValue(v) {
  var c = /^(.*?)(\s+#.*)?$/.exec(v), val = c[1], com = c[2] || "";
  var out;
  if (!val) out = "";
  else if (/^("(?:[^"\\]|\\.)*"|'[^']*')$/.test(val)) out = span("st", val);
  else if (/^(true|false|null|yes|no)$/i.test(val)) out = span("kw", val);
  else if (/^-?\d+(\.\d+)?[a-z%]*$/i.test(val)) out = span("nm", val);
  else out = span("st", val);
  return out + (com ? span("cm", com) : "");
}

function highlightYaml(code) {
  return code.split("\n").map(function (line) {
    if (/^\s*#/.test(line)) return span("cm", line);
    var m = /^(\s*)(- )?([A-Za-z_][\w.\-]*)(\s*:)(\s*)(.*)$/.exec(line);
    if (m) return esc(m[1]) + (m[2] ? span("pn", m[2]) : "") + span("fn", m[3]) + span("pn", m[4]) + esc(m[5]) + highlightYamlValue(m[6]);
    var l = /^(\s*)- (.*)$/.exec(line);
    if (l) return esc(l[1]) + span("pn", "- ") + highlightYamlValue(l[2]);

function highlightTree(code) {
  return code.split("\n").map(function (line) {
    var m = /^([\s│├└─]*)(\S.*?)(\s{2,}(.*))?$/.exec(line);
    if (!m) return esc(line);
    var lead = m[1], name = m[2], gap = (m[3] || "").match(/^\s*/)[0], comment = m[4];
    var rails = lead.replace(/[│├└─]+/g, function (r) { return '<span class="tk-br">' + r + "</span>"; });
    var nameHtml = /\/$/.test(name) ? span("dir", name) : span("fn", name);
    return rails + nameHtml + (comment ? gap + span("cm", comment) : "");

}

function highlight(lang, code) {
  if (lang === "go") return highlightGo(code);
  if (lang === "yaml" || lang === "yml") return highlightYaml(code);
  if (lang === "sql" || lang === "pgsql" || lang === "postgresql") return highlightSql(code);
  if (lang === "text" && /[├└]/.test(code)) return highlightTree(code);
  return esc(code);
}

function renderMarkdown(src) {
  var lines = src.replace(/\r\n/g, "\n").split("\n");
  var body = [], toc = [], seen = {}, i = 0, n = lines.length, m, gapCount = 0;
  var block = /^(#{1,6} |```|\||\s*[-*] |\s*\d+\. |> |-{3,}\s*$)/;
  while (i < n) {
    var line = lines[i];
    if (!line.trim()) { i++; continue; }

    if ((m = /^(#{1,6}) +(.+)$/.exec(line))) {
      var lvl = m[1].length, text = m[2], id = slug(text);
      if (seen[id] !== undefined) { seen[id]++; id += "-" + seen[id]; } else { seen[id] = 0; }
      if (lvl === 2 || lvl === 3) toc.push('<a class="l' + lvl + '" href="#' + id + '">' + inline(text) + "</a>");
      body.push("<h" + lvl + ' id="' + id + '">' + inline(text) + "</h" + lvl + ">");
      i++; continue;
    }
    if (/^```/.test(line)) {
      var lang = line.slice(3).trim() || "text", code = [];
      i++;
      while (i < n && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
      i++;
      body.push('<pre class="code ' + esc(lang) + '"><code>' + highlight(lang, code.join("\n")) + "</code></pre>");
      continue;
    }
    if (/^\|/.test(line)) {
      var rows = [];
      while (i < n && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      if (rows.length >= 2 && /^\|[\s:|-]+\|?\s*$/.test(rows[1])) body.push(renderTable(rows));
      else body.push("<p>" + inline(rows.join(" ")) + "</p>");
      continue;
    }
    if (/^(-{3,}|\*{3,})\s*$/.test(line)) { body.push("<hr>"); i++; continue; }
    if (/^> ?/.test(line)) {
      var q = [];
      while (i < n && /^> ?/.test(lines[i])) { q.push(lines[i].replace(/^> ?/, "")); i++; }
      body.push("<blockquote>" + inline(q.join(" ")) + "</blockquote>");
      continue;
    }
    if (/^\s*[-*] /.test(line)) {
      var ul = [];
      while (i < n && /^\s*[-*] /.test(lines[i])) { ul.push(lines[i].replace(/^\s*[-*] /, "")); i++; }
      body.push("<ul>" + ul.map(function (t) { return "<li>" + inline(t) + "</li>"; }).join("") + "</ul>");
      continue;
    }
    if (/^\s*\d+\. /.test(line)) {
      var ol = [];
      while (i < n && /^\s*\d+\. /.test(lines[i])) { ol.push(lines[i].replace(/^\s*\d+\. /, "")); i++; }
      body.push("<ol>" + ol.map(function (t) { return "<li>" + inline(t) + "</li>"; }).join("") + "</ol>");
      continue;
    }
    var para = [];
    while (i < n && lines[i].trim() && !block.test(lines[i])) { para.push(lines[i]); i++; }
    if (!para.length) { para.push(lines[i]); i++; }
    var gapHtml = inline(para.join(" "));
    if (/^<strong>Gap\.<\/strong>/.test(gapHtml)) {
      gapCount++;
      body.push('<p id="gap-' + gapCount + '">' + gapHtml.replace(/^<strong>Gap\.<\/strong>/, '<a class="gap-badge" href="#gap-' + gapCount + '">Gap</a>') + "</p>");
    } else {
      body.push("<p>" + gapHtml + "</p>");
    }

}

/* ---- sorting: pure functions, no page needed ---- */
var collator = (typeof Intl !== "undefined") ? new Intl.Collator(undefined, { numeric: true, sensitivity: "base" }) : null;
function compareText(a, b) {
  if (a === "" && b !== "") return 1;      // empty cells always last
  if (b === "" && a !== "") return -1;
  return collator ? collator.compare(a, b) : (a < b ? -1 : a > b ? 1 : 0);
}
/* values: the text of one column; state: "ascending", "descending" or "none".
   Returns the original row positions in the order the rows should be shown. */
function sortedOrder(values, state) {
  var order = values.map(function (v, i) { return i; });
  if (state === "none") return order;
  var sign = state === "ascending" ? 1 : -1;
  order.sort(function (x, y) {
    var a = values[x], b = values[y];
    var c = (a === "" || b === "") ? compareText(a, b) : sign * compareText(a, b);
    return c || (x - y);                   // equal rows keep their original order
  });
  return order;
}
function nextState(state) { return state === "none" ? "ascending" : state === "ascending" ? "descending" : "none"; }

/* ---- browser only ---- */
if (typeof document !== "undefined") {
  var content = document.getElementById("content"), nav = document.getElementById("toc"), tip = document.getElementById("tip");
  document.getElementById("to-top").addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });

  function markOverflow() {
    var cells = document.querySelectorAll(".cell");

    tip.textContent = cell.textContent;
    tip.style.left = "0px"; tip.style.top = "0px";
    var r = cell.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    var left = Math.max(8, Math.min(r.left, document.documentElement.clientWidth - w - 8));
    var top = r.top - h - 8 > 8 ? r.top - h - 8 : r.bottom + 8;
    tip.style.left = left + "px"; tip.style.top = top + "px";
    tip.classList.add("on");
  }
  function hideTip() { tip.classList.remove("on"); }

  document.addEventListener("mouseover", function (e) { var c = e.target.closest && e.target.closest(".cell"); if (c) showTip(c); });
  document.addEventListener("mouseout", function (e) { if (e.target.closest && e.target.closest(".cell")) hideTip(); });
  document.addEventListener("focusin", function (e) { var c = e.target.closest && e.target.closest(".cell"); if (c) showTip(c); });
  document.addEventListener("focusout", hideTip);
  window.addEventListener("resize", markOverflow);

  function sortBy(th) {
    var table = th.closest("table"), ths = Array.prototype.slice.call(th.parentNode.children), col = ths.indexOf(th);
    var state = nextState(th.getAttribute("aria-sort"));
    ths.forEach(function (x) { x.setAttribute("aria-sort", "none"); });

    var values = rows.map(function (r) { return r.cells[col].textContent.trim(); });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var th = e.target.closest && e.target.closest("th[aria-sort]");
    if (th) { e.preventDefault(); sortBy(th); }
  });

  var out = renderMarkdown(SOURCE);
  content.innerHTML = out.html;
  nav.innerHTML = "<b>Contents</b>" + out.toc;
  markOverflow();
  if (location.hash) { var target = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (target) target.scrollIntoView(); }
}

if (typeof module !== "undefined") module.exports = { renderMarkdown: renderMarkdown, sortedOrder: sortedOrder, nextState: nextState, highlightGo: highlightGo, highlightSql: highlightSql, highlightYaml: highlightYaml, highlightTree: highlightTree };
